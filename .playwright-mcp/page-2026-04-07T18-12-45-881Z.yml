        - generic [ref=e31]: 🛡
        - heading "Agents need sandboxing" [level=3] [ref=e32]
        - paragraph [ref=e33]: AI coding agents get full terminal access. Without isolation, one bad command can reach your SSH keys, cloud credentials, or git push to production. LINCE lets you sandbox each agent with multiple backends — and choose per-agent at runtime.
      - generic [ref=e34]:
        - generic [ref=e35]: 🎯
        - heading "Orchestrate, don't babysit" [level=3] [ref=e36]
        - paragraph [ref=e37]: Run 8+ agents in parallel across different projects. The TUI dashboard shows real-time status, token usage, and active tools. Spawn, focus, hide, kill agents with single keystrokes.
      - generic [ref=e38]:
        - generic [ref=e39]: 🎙
        - heading "Whisper to any agent" [level=3] [ref=e40]
        - paragraph [ref=e41]: Speak and your words are transcribed locally via Whisper, then routed to whichever agent has focus. No audio leaves your machine. Works with any agent, not just one vendor.
      - generic [ref=e42]:
        - generic [ref=e43]: 🌐
        - heading "No vendor lock-in" [level=3] [ref=e44]
        - paragraph [ref=e45]: Your workflow and security should not depend on a single vendor. LINCE supports Claude Code, Codex, Gemini, OpenCode, Aider, Amp — and any custom agent via config. Switch freely.
